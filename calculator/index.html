<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="background-effects" aria-hidden="true">
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="sparkle">✦</span>
        <span class="sparkle">✧</span>
        <span class="sparkle">✦</span>
        <span class="sparkle">✧</span>
        <span class="sparkle">✦</span>
    </div>
    <div class="calculator">
        <div class="calculator-header">
            <h1>CALCULATOR</h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">☀</button>
        </div>
        <input type="text" placeholder="0" id="result">
        <div class="button">
            <button><strong>AC</strong></button>
            <button><strong>%</strong></button>
            <button><strong>C</strong></button>
            <button><strong>/</strong></button>
            <button><strong>7</strong></button>
            <button><strong>8</strong></button>
            <button><strong>9</strong></button>
            <button><strong>*</strong></button>
            <button><strong>4</strong></button>
            <button><strong>5</strong></button>
            <button><strong>6</strong></button>
            <button><strong>-</strong></button>
            <button><strong>1</strong></button>
            <button><strong>2</strong></button>
            <button><strong>3</strong></button>
            <button><strong>+</strong></button>
            <button><strong>00</strong></button>
            <button><strong>0</strong></button>
            <button><strong>.</strong></button>
            <button><strong>=</strong></button>
        </div>
    </div>
</body>
</html>
